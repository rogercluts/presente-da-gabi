<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nosso 1 Ano ❤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="img/margarida.webp" as="image">
</head>
<body>
  <div id="coracoes"></div>

  <!-- Tela de abertura -->
  <section id="abertura">
    <button id="btn-coracao" aria-label="Abrir">
      <span class="flor-grande"></span>
      <svg viewBox="0 0 32 29"><path fill="currentColor" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"/></svg>
    </button>
    <p id="texto-abertura"></p>
  </section>

  <main id="conteudo">
    <header class="topo">
      <p class="nomes" id="nomes"></p>
      <h1 id="titulo"></h1>
      <p class="subtitulo" id="subtitulo"></p>
    </header>

    <section class="cartao">
      <div class="carrossel" id="carrossel">
        <div class="slides" id="slides"></div>
        <button class="seta esq" id="ant" aria-label="Anterior">‹</button>
        <button class="seta dir" id="prox" aria-label="Próxima">›</button>
        <div class="pontos" id="pontos"></div>
      </div>
    </section>

    <section class="cartao" id="player-box">
      <div class="player">
        <div class="disco" id="disco"></div>
        <div class="info-musica">
          <strong id="musica-nome"></strong>
          <span id="musica-artista"></span>
          <div class="barra"><div id="progresso"></div></div>
        </div>
        <button id="play" aria-label="Tocar">▶</button>
      </div>
      <audio id="audio" loop preload="auto"></audio>
    </section>

    <section class="cartao">
      <h2>Juntos há</h2>
      <div class="contador" id="contador"></div>
      <p class="desde" id="desde"></p>
    </section>

    <section class="cartao">
      <h2>Nossa história</h2>
      <ol class="linha-tempo" id="linha-tempo"></ol>
    </section>

    <section class="cartao">
      <h2>Motivos pelos quais eu te amo</h2>
      <p class="motivo" id="motivo"></p>
      <button class="botao" id="btn-motivo">Me conta mais um</button>
    </section>

    <section class="cartao carta">
      <h2>Uma carta pra você</h2>
      <div id="carta"></div>
      <p class="assinatura" id="assinatura"></p>
    </section>

    <footer>
      <div class="buque"><span></span><span></span><span></span><span></span><span></span></div>
      <p class="final" id="final"></p>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="margarida.js"></script>
  <script src="script.js"></script>
</body>
</html>
